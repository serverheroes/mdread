<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>/*CSS*/</style>
</head>
<body>
  <div id="progress" aria-hidden="true"></div>

  <nav id="toc" aria-label="Table of contents">
    <div class="toc-head">Contents</div>
    <div class="toc-links">{{TOC}}</div>
    <div class="toc-foot">
      <span><kbd>t</kbd> contents</span>
      <span><kbd>f</kbd> focus</span>
      <span><kbd>b</kbd> bionic</span>
      <span><kbd>d</kbd> theme</span>
      <span><kbd>−</kbd>/<kbd>+</kbd> text size</span>
    </div>
  </nav>
  <div id="toc-backdrop"></div>

  <header id="toolbar">
    <button id="btn-toc" title="Contents (t)" aria-label="Table of contents">
      <svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
    </button>
    <div class="toolbar-group">
      <button id="btn-smaller" title="Smaller text (−)" aria-label="Smaller text"><span class="a-small">A</span></button>
      <button id="btn-larger" title="Larger text (+)" aria-label="Larger text"><span class="a-large">A</span></button>
      <button id="btn-font" title="Serif / sans-serif (s)" aria-label="Toggle typeface"><span class="ff">Aa</span></button>
      <span class="sep"></span>
      <button id="btn-bionic" title="Bionic reading (b)" aria-label="Toggle bionic reading"><span class="bionic-icon"><b>Bi</b>onic</span></button>
      <button id="btn-focus" title="Focus mode (f)" aria-label="Toggle focus mode">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.4" fill="currentColor"/><path d="M8 1.5v2.2M8 12.3v2.2M1.5 8h2.2M12.3 8h2.2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-theme" title="Theme (d)" aria-label="Cycle theme">
        <svg viewBox="0 0 16 16"><path d="M8 1.5a6.5 6.5 0 1 0 0 13V1.5z" fill="currentColor"/><circle cx="8" cy="8" r="6.5" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div class="doc-meta">
      <span class="doc-file">{{FILENAME}}</span>
      <span class="doc-stats">{{META}}</span>
    </div>
    <article id="content">{{CONTENT}}</article>
    <footer class="doc-end"><span>❦</span></footer>
  </main>

<script>/*JS*/</script>
</body>
</html>
